<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONG Esperança - Cadastro de Colaborador</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <img src="img/logo.png" alt="Logotipo da ONG Esperança.">
        <h1>ONG Esperança</h1>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="projetos.html">Projetos</a></li>
                <li><a href="cadastro.html">Seja Voluntário</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Cadastro de Voluntários e Apoiadores</h2>
            <form action="#" method="POST">
                
                <fieldset>
                    <legend>Dados Pessoais</legend>

                    <label for="nome">Nome Completo:</label><br>
                    <input type="text" id="nome" name="nome" required minlength="3"><br><br>

                    <label for="email">E-mail:</label><br>
                    <input type="email" id="email" name="email" required><br><br>

                    <label for="nascimento">Data de Nascimento:</label><br>
                    <input type="date" id="nascimento" name="nascimento" required><br><br>

                    <label for="cpf">CPF (formato 000.000.000-00):</label><br>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" 
                           pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" 
                           title="Digite o CPF no formato: 000.000.000-00" required><br><br>

                    <label for="telefone">Telefone (formato (00) 00000-0000):</label><br>
                    <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999" 
                           pattern="\(\d{2}\)\s\d{4,5}-\d{4}" 
                           title="Digite o telefone no formato: (11) 99999-9999" required><br><br>
                </fieldset>

                <br>

                <fieldset>
                    <legend>Endereço</legend>

                    <label for="logradouro">Rua/Avenida:</label><br>
                    <input type="text" id="logradouro" name="logradouro" required><br><br>

                    <label for="cidade">Cidade:</label><br>
                    <input type="text" id="cidade" name="cidade" required><br><br>

                    <label for="estado">Estado (UF):</label><br>
                    <input type="text" id="estado" name="estado" maxlength="2" placeholder="SP" required><br><br>

                    <label for="cep">CEP (formato 00000-000):</label><br>
                    <input type="text" id="cep" name="cep" placeholder="12345-678" 
                           pattern="\d{5}-\d{3}" 
                           title="Digite o CEP no formato: 00000-000" required><br><br>
                </fieldset>

                <br>

                <button type="submit">Enviar Cadastro</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ONG Esperança. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
